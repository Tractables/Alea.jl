name: Unit Tests 

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on: 
  pull_request:
  push:
  workflow_dispatch:

env:
  JIVE_PROCS: 1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1.11'

      - name: Install Latex Dependencies
        run:
          sudo apt update && sudo apt install -y pdf2svg texlive-latex-base texlive-binaries texlive-latex-extra texlive-luatex

      - name: Install SymPy
        run:
          pip3 install sympy

      # The release binary of tddlog, for the tests of the Tddlog backend
      # (test/inference/tddlog_test.jl), which are skipped without it.
      - name: Install tddlog
        env:
          TDDLOG_VERSION: 0.1.1
          TDDLOG_SHA256: 6576361e7d8153dd287d24c70d4392cb87ab7e616b4e85313a16b673e380ea65
        run: |
          name=tddlog-v$TDDLOG_VERSION-x86_64-unknown-linux-gnu
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/Tractables/tddlog/releases/download/v$TDDLOG_VERSION/$name.tar.gz"
          echo "$TDDLOG_SHA256  $name.tar.gz" | sha256sum -c -
          tar xzf "$name.tar.gz"
          "$RUNNER_TEMP/$name/tddlog" --version
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # The forks of CUDD.jl and IRTools.jl come from Project.toml's [sources].
      - name: Instantiate Packages
        run: |
          julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.build();'

      - name: Unit Tests
        run:
          julia --project --check-bounds=yes --depwarn=yes -e 'import Pkg; Pkg.test(; coverage=true)'
      
      - name: Codecov Upload
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run:
          julia -e 'using Pkg; Pkg.add("Coverage"); using Coverage; Codecov.submit(process_folder());'
